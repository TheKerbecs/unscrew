name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          ./build.sh
          build/Unscrew.app/Contents/MacOS/Unscrew --selftest
          ditto -c -k --keepParent build/Unscrew.app Unscrew.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Unscrew.zip --title "Unscrew $GITHUB_REF_NAME" --generate-notes
